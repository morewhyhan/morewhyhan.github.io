# Butterfly overrides for the local Hexo source.
# This file is intentionally separate from themes/butterfly/_config.yml so the
# theme submodule can be updated without losing the site's configuration.

nav:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  时间轴: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  知识花园: /notes/ || fas fa-project-diagram
  清单||fas fa-heartbeat:
    图书笔记: /book/ || fas fa-book-open
  支持我: /reward/ || fas fa-thumbs-up
  友情链接: /link/ || fas fa-link
  关于: /about/ || fas fa-heart

code_blocks:
  theme: darker
  macStyle: true
  height_limit: 300
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

social:
  fab fa-github: https://github.com/morewhyhan/ || GitHub || '#24292e'
  fab fa-x-twitter: https://x.com/merhrwis || X（推特）
  fab fa-tiktok: https://v.douyin.com/1Y7tAnrwnl8 || 抖音
  fab fa-weixin: https://mp.weixin.qq.com/s/ifeYG1mTfHlC2q_Y9rZO-g || 微信公众号文章

favicon: /img/favicon.ico

avatar:
  img: /img/myself.png
  effect: false

default_top_img: /img/hua.png
index_img: /img/home-starry-sky.webp
archive_img: /img/hua.png
footer_img: /img/hua.png

cover:
  index_enable: false
  aside_enable: false
  archives_enable: true
  default_cover:
    - /img/hua.png

index_post_content:
  method: 2
  length: 500

error_404:
  enable: true
  subtitle: 页面不存在
  background: /img/error-page.png

subtitle:
  enable: true
  effect: true
  typed_option:
    typeSpeed: 80
    backSpeed: 40
    loop: true
  source: false
  sub:
    - '世界是随机的，但我们并非无能为力。'
    - '运气很少是孤立而戏剧性的雷击，而是不断吹的风。 —— 蒂娜·齐利格'
    - '我们既塑造决策，也被决策塑造，每次选择都在重构骰子本身的偏向性。'
    - '我们唯一能够逃避的就是逃避本身。 —— 卡夫卡'
    - '参差不齐乃是幸福本源。 —— 罗素'
    - '一切有为法，如梦幻泡影，如露亦如电，应作如是观。 —— 《金刚经》'
    - '道德不是指导我们如何使自己幸福的学说，而是指导我们如何使自己配得上幸福的学说。 —— 康德'

toc:
  post: true
  page: false
  number: true
  expand: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/morewhyhan
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: true
  text: 感谢你的支持
  QR_code:
    - img: /img/wechat.jpg
      text: 微信
    - img: /img/alipay.jpg
      text: 支付宝

aside:
  enable: true
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: 概率论中没有绝对的零，无限次的重复将使其趋近必然。
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/morewhyhan/
  card_announcement:
    enable: true
    content: Hello ! Welcome my World!
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_post_series:
    enable: false
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

busuanzi:
  site_uv: false
  site_pv: false

translate:
  enable: true
  default: 繁
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: 繁
  msgToSimplifiedChinese: 簡

darkmode:
  enable: true
  button: true
  autoChangeMode: 1

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

search:
  use: local_search
  placeholder: 搜索文章
  path: search.xml
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8

lightbox: fancybox

canvas_nest:
  enable: true
  color: '205,105,110'
  opacity: 0.42
  zIndex: -1
  count: 88
  mobile: false

mermaid:
  enable: true
  code_write: false
  theme:
    light: default
    dark: dark

pjax:
  enable: true

font:
  global_font_size: 16px
  font_family: '"LXGW WenKai Screen", system-ui, sans-serif'

inject:
  head:
    - <link rel="stylesheet" href="https://cdn.staticfile.org/lxgw-wenkai-screen-webfont/1.7.0/style.css">
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script defer src="/js/content-breadcrumb.js?v=2"></script>

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
  option:
    busuanzi: https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js
