# Butterfly overrides for the local Hexo source.
# This file is intentionally separate from themes/butterfly/_config.yml so the
# theme submodule can be updated without losing the site's configuration.

nav:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  内容目录: /content-directory/ || fas fa-folder-tree
  时间轴: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  知识花园: /notes/ || fas fa-project-diagram
  清单||fas fa-heartbeat:
    图书笔记: /book/ || fas fa-book-open
  支持我: /reward/ || fas fa-thumbs-up
  友情链接: /link/ || fas fa-link
  关于: /about/ || fas fa-heart

code_blocks:
  theme: darker
  macStyle: true
  height_limit: 300
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

social:
  fab fa-github: https://github.com/morewhyhan/ || GitHub || '#24292e'
  fab fa-x-twitter: https://x.com/merhrwis || X（推特）
  fab fa-tiktok: https://v.douyin.com/1Y7tAnrwnl8 || 抖音
  fab fa-weixin: https://mp.weixin.qq.com/s/ifeYG1mTfHlC2q_Y9rZO-g || 微信公众号文章

favicon: /img/favicon.ico

avatar:
  img: /img/myself.png
  effect: false

default_top_img: /img/hua.png
index_img: /img/home-starry-sky.webp
archive_img: /img/hua.png
footer_img: /img/hua.png

cover:
  index_enable: false
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/hua.png

index_post_content:
  method: 2
  length: 500

error_404:
  enable: true
  subtitle: 页面不存在
  background: /img/error-page.png

subtitle:
  enable: true
  effect: true
  typed_option:
    typeSpeed: 80
    backSpeed: 40
    loop: true
  source: false
  sub:
    - '当追随真理超出了我们的能力时，我们应该追随最可能是真理的东西。 —— 笛卡尔'
    - '如果我不能比这个世界上最聪明的人还要更好地反驳我自己拥有的观点，那我就不配拥有这个观点。 —— 查理·芒格'
    - '道德不是指导我们如何使自己幸福的学说，而是指导我们如何使自己配得上幸福的学说。 —— 康德'
    - '在资源有限的情况下，每一个“是”都意味着对其他选择的“否定”。'
    - '人生的决策，归根结底，是一次漫长而坚定的自我塑造。'
    - '世界是随机的，但我们并非无能为力。'
    - '决策的真正使命，是面向不确定性的未来，在此刻分配人生的资源，以实现人生持续向好的概率最大化。'
    - '生命中最重要的问题，在很大程度上，其实都是概率问题。 —— 拉普拉斯'
    - '靠水晶球谋生的人，注定要吃碎成一地的玻璃。 —— 达利欧'
    - '从预言中，你可以看出很多关于预言者的信息，却很难从中了解到未来本身。 —— 巴菲特'
    - '运气很少是孤立而戏剧性的雷击，而是不断吹的风。 —— 蒂娜·齐利格'
    - '在初学者的心中，有无限可能；在专家的心中，则几乎没有。 —— 铃木俊隆'
    - '一个理论的科学性在于它的可证伪性，而不是它被确证的程度。'
    - '不是追求事事明白，而是不做不明白的事情。'
    - '预测不如对策。'
    - '比输赢更重要的，是输多少和赢多少。'
    - '风险不是意外本身，而是你认定“意外不可能发生”的那份自信。'
    - '长期来看，坚持不做傻事的人，比那些试图变得极其聪明的人拥有更大的优势。 —— 查理·芒格'
    - '人生就像滚雪球，重要的是找到很湿的雪和很长的坡。 —— 巴菲特'
    - '永远不把第一优先级的事情，放在时间表的第二位置。'
    - '我需要的是：尊重常识，减少错误；分散风险，降低成本；保持长期，接受波动；制定规则，坚定执行。'
    - '我们既塑造决策，也被决策塑造，每次选择都在重构骰子本身的偏向性。'
    - '为了逃避不确定性，我们愿意做任何辛苦的事儿。'
    - '优于别人，并不高贵，真正的高贵应该是优于过去的自己。 —— 海明威'
    - '假如你知道自己愚蠢，并且能够定义出愚蠢的边界，那么这愚蠢就会成为智慧的一部分。'
    - '生活通过（对你以为的“真相”）说不的方式，帮助你一步步逼近真相。'
    - '工程思维：以资源有限为前提，有创意地应用科学方法，来系统化地解决现实问题。'
    - '简单本身就已经是一种结果，而非方法。'
    - '对世界真实、对他人真诚、对自己诚实。'
    - '通过认识到那些引起焦虑的事物并不重要，可以缓解大部分忧虑。 —— 罗素'
    - '对选择说“不”，也是选择的一种。'
    - '成熟，首先是对结果负责，而不是对规则；其次是敢于直面冲突；第三是具备自主决策能力。'
    - '我宁愿在污泥中快活，也不愿被人供奉。 —— 庄子'
    - '人生就像摆钟一样，在痛苦与无聊之间摆荡，当欲望得不到满足时就痛苦，当欲望得到满足时就无聊。 —— 叔本华'
    - '所谓的过去、现在和未来，只不过是些顽固的幻觉罢了。 —— 爱因斯坦'
    - '人被判处自由。 —— 萨特'
    - '贪婪的问题不在于“想赢”，而在于没有清晰的胜利定义。'
    - '一切有为法，如梦幻泡影，如露亦如电，应作如是观。 —— 《金刚经》'
    - '人生的骰子在时间长河中不断翻滚，每一次的“六”都值得珍惜，即使下一秒可能变成“一”。'
    - '而爱，就是让两个人的骰子抛出的数字加在一起，可以组合出人世间更多的美妙可能性。'
    - '我们唯一能够逃避的就是逃避本身。 —— 卡夫卡'
    - '大自然的底层算法是：变异—选择—复制。人生的底层算法则是：独特—发现—放大。'

toc:
  post: true
  page: false
  number: true
  expand: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/morewhyhan
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: true
  text: 感谢你的支持
  QR_code:
    - img: /img/wechat.jpg
      text: 微信
    - img: /img/alipay.jpg
      text: 支付宝

aside:
  enable: true
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: 概率论中没有绝对的零，无限次的重复将使其趋近必然。
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/morewhyhan/
  card_announcement:
    enable: true
    content: Hello ! Welcome my World!
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_post_series:
    enable: false
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

translate:
  enable: true
  default: 繁
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: 繁
  msgToSimplifiedChinese: 簡

darkmode:
  enable: true
  button: true
  autoChangeMode: 1

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

search:
  use: local_search
  placeholder: 搜索文章
  path: search.xml
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8

lightbox: fancybox

canvas_nest:
  enable: true
  color: '150,170,190'
  opacity: 0.42
  zIndex: -1
  count: 88
  mobile: false

mermaid:
  enable: true
  code_write: false
  theme:
    light: default
    dark: dark

pjax:
  enable: true

font:
  global_font_size: 16px
  font_family: '"LXGW WenKai Screen", system-ui, sans-serif'

inject:
  head:
    - <link rel="stylesheet" href="https://cdn.staticfile.org/lxgw-wenkai-screen-webfont/1.7.0/style.css">
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script defer src="/js/content-breadcrumb.js?v=2"></script>

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
  option:
    busuanzi: https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js
